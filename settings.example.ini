# Copy to settings.ini and change what you need. Environment variables in parentheses override a key.
# A settings.ini in the save folder is read instead of the one next to the game; the in-game pages
# save there.
# Window: windowed, borderless (covers the screen at the desktop resolution) or fullscreen
# (DECEPTION_DISPLAY_MODE).
display_mode=borderless
# Aspect ratio of the window: 16:9 (the PS4's), 4:3, 21:9 or 32:9 (DECEPTION_ASPECT_RATIO). The game
# itself is always 16:9, with black bars on other shapes. Set at start.
aspect_ratio=16:9
# Windowed resolution, WIDTHxHEIGHT: the window's size, of the aspect ratio (another shape moves to the
# size of that ratio nearest in height) (DECEPTION_OUTPUT_RESOLUTION). The fullscreen modes pick their
# own: borderless the desktop, fullscreen the largest screen mode of the ratio (else the desktop's),
# with black bars when the screen is of another shape. The game's picture is filtered to it.
output_resolution=1920x1080
# Display index the window opens on, empty for the primary (DECEPTION_MONITOR).
monitor=
# VSync (DECEPTION_VSYNC): 1 waits for the monitor; 0 shows the newest frame at each refresh,
# still without tearing (some drivers hold that to twice the refresh rate).
vsync=1
# With vsync=0: 1 shows each frame at once, tearing allowed: the least input delay and no frame rate
# ceiling (DECEPTION_TEARING). README "Advanced settings".
tearing=0
# Sharpening (DECEPTION_SHARPENING): 1 (default) runs AMD FSR 1 RCAS over the picture at the window's
# size, for crisper edges without halos; 0 shows it as filtered. Also in the Display Settings panel,
# where it applies at once, and on F9, which switches it over the game to compare.
sharpening=1
# HDR (DECEPTION_HDR; next start): 1 offers the game an HDR10 (BT.2020 PQ) display, and the game
# switches its own output to HDR. Needs a display with HDR on (Windows: Use HDR); without one the
# game stays SDR.
hdr=0
# Speakers: auto, stereo, 5.1, 7.1 (DECEPTION_AUDIO_CHANNELS).
audio_channels=auto
# 1 (default): hurry through the KOEI TECMO logos and the autosave notice and press through
# "Press ANY button", so a start lands on the title menu (NEW GAME / CONTINUE) in about 6 s.
# 0 plays the start as usual. The setup's checkbox
# sets it (DECEPTION_SKIP_INTRO).
skip_intro=1
